<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/output.css" />
		<title>Avaliação observacional individual dos alunos | IPB</title>
		<script src="./js/app-data.js" defer></script>
		<script src="./js/app-shell.js" defer></script>
		<script src="./js/app.js" defer></script>
		<script src="./js/table-header.js" defer></script>
	</head>
	<body class="min-h-screen bg-neutral-secondary-soft font-sans text-body">
		<nav aria-label="Navegação principal"></nav>
		<main
			class="mx-auto max-w-screen-2xl space-y-6 px-4 pb-8 pt-24 sm:px-6 lg:px-8"
		>
			<header class="space-y-2">
				<div class="flex flex-wrap items-center gap-3">
					<h1
						id="avaliacao-titulo"
						class="text-2xl font-semibold tracking-tight text-heading"
					>
						Avaliação observacional individual dos alunos
					</h1>
				</div>
			</header>
            <section class="app-card app-card-body flex flex-wrap items-end gap-4" aria-label="Contexto da avaliação">
                <div class="app-field w-full sm:w-64"><label for="avaliacao-turma">Turma</label><select id="avaliacao-turma" class="app-input"></select></div>
                <div class="app-field"><label for="avaliacao-data">Data da avaliação</label><input id="avaliacao-data" type="date" class="app-input" required></div>
                <p id="avaliacao-feedback" hidden aria-live="polite"></p>
            </section>


			<div class="flex flex-col items-start gap-3">
				<section
					id="card-legenda"
					aria-labelledby="titulo-legenda"
					class="relative flex flex-col items-center gap-3 rounded-base border border-default border-t-4 border-t-blue-500 bg-neutral-primary-soft px-5 pe-12 py-3"
				>
					<button
						type="button"
						data-dismiss-target="#card-legenda"
						aria-label="Fechar legenda"
						class="absolute end-2 top-2 inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-base text-body-subtle hover:bg-neutral-tertiary hover:text-heading focus-visible:outline-2 focus-visible:outline-brand"
					>
						<svg
							class="h-4 w-4"
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
							focusable="false"
						>
							<path d="m18 6-12 12M6 6l12 12" />
						</svg>
					</button>
					<h2
						id="titulo-legenda"
						class="flex items-center gap-2 whitespace-nowrap text-center text-sm font-semibold text-blue-700 dark:text-blue-400"
					>
						<svg
							class="h-5 w-5"
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
							focusable="false"
						>
							<circle cx="12" cy="12" r="9" />
							<path d="M12 11v5m0-8h.01" />
						</svg>
						<span>Legenda</span>
					</h2>
					<ul
						id="legenda-status"
						class="flex flex-wrap justify-center gap-x-8 gap-y-4 text-sm"
						aria-labelledby="titulo-legenda"
					></ul>
				</section>
			</div>

			<section
				aria-labelledby="avaliacao-titulo"
				class="rounded-base border border-default bg-neutral-primary-soft"
			>
				<div
					id="barra-selecao"
					class="sticky top-[4.5rem] z-30 flex flex-wrap items-center justify-between gap-3 border-b border-default bg-neutral-primary-soft px-4 py-3"
				>
					<p
						id="selecao-resumo"
						role="status"
						aria-live="polite"
						aria-atomic="true"
						class="text-sm font-medium text-body"
					></p>
					<button
						id="limpar-selecao"
						type="button"
						disabled
						class="inline-flex items-center gap-2 rounded-base border border-yellow-500 bg-yellow-400 px-3 py-2 text-sm font-semibold text-yellow-950 hover:bg-yellow-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-700 disabled:cursor-not-allowed disabled:opacity-40"
					>
						<svg
							class="h-4 w-4"
							xmlns="http://www.w3.org/2000/svg"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							aria-hidden="true"
							focusable="false"
						>
							<circle cx="12" cy="12" r="9" />
							<path d="m15 9-6 6m0-6 6 6" />
						</svg>
						<span>Limpar seleção</span>
					</button>
				</div>
				<div
					id="tabela-rolagem"
					role="region"
					aria-label="Tabela de avaliação dos alunos"
					tabindex="0"
					class="relative overflow-x-auto rounded-b-base focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-brand"
				>
					<table
						class="evaluation-table observation-table w-full border-separate border-spacing-0 text-left text-sm text-body"
					>
						<caption class="sr-only">
							Avaliação dos alunos da turma por dez critérios. Cada
							célula começa sem status e permite alternar entre OK
							e Não OK.
						</caption>
						<thead>
							<tr id="cabecalho-criterios">
								<th scope="col" class="selection-cell">
									<label class="selection-label">
										<input
											id="selecionar-todos"
											type="checkbox"
											class="student-checkbox"
										/>
										<span class="sr-only"
											>Selecionar todos os alunos</span
										>
									</label>
								</th>
								<th
									scope="col"
									class="student-cell px-4 py-4 font-semibold"
								>
									Aluno
								</th>
							</tr>
						</thead>
						<tbody id="alunos"></tbody>
					</table>
				</div>
			</section>

			<button
				id="salvar-avaliacao"
				type="button"
				class="rounded-base bg-brand px-5 py-2.5 text-sm font-medium text-white hover:bg-brand-strong focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
			>
				Salvar avaliação
			</button>
			<noscript
				><p>
					Ative o JavaScript para visualizar os alunos e preencher as
					avaliações.
				</p></noscript
			>
		</main>
		<script src="./node_modules/flowbite/dist/flowbite.min.js"></script>
	</body>
</html>
