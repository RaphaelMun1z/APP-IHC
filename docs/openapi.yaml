openapi: 3.1.0
info:
  title: IPB — contrato proposto da API
  version: 1.0.0
  description:
    Contratos implementados pelos serviços Angular e pelo interceptor mock. Backend ainda não
    implementado. Endereçamento REST, cookie de sessão e códigos HTTP são propostas de integração pendentes de
    validação; regras pedagógicas provêm do frontend atual.
servers:
  - url: /api/v1
    description: Base padrão; substituível por environment.api.baseUrl.
security:
  - sessionCookie: []
tags:
  - name: Autenticação
    description: Operações de autenticação.
  - name: Catálogo
    description: Operações de catálogo.
  - name: Alunos
    description: Operações de alunos.
  - name: Turmas
    description: Operações de turmas.
  - name: Preferências
    description: Operações de preferências.
  - name: Aulas
    description: Operações de aulas.
  - name: Frequência
    description: Operações de frequência.
  - name: Avaliações
    description: Operações de avaliações.
paths:
  /auth/session:
    post:
      operationId: login
      summary: Autenticar e iniciar sessão
      description:
        No mock, aceita professor e coordenacao com senha ipb123; trim e lowercase no usuário. Credenciais inválidas
        retornam 401. Persiste somente o DTO da sessão, nunca senha. Em API real, cookie HttpOnly é proposta
        pendente de validação.
      tags:
        - Autenticação
      x-authorized-role: public
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                id: professor-01
                nome: Mariana Oliveira
                perfil: professor
        '400':
          description: Estrutura JSON inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_REQUEST
                message: Formato da requisição inválido.
        '401':
          description: Credenciais inválidas ou sessão ausente/expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_CREDENTIALS
                message: Usuário ou senha incorretos.
        '422':
          description: Regra de validação do domínio não atendida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: DOMAIN_ERROR
                message: Informe um nome com até 100 caracteres.
        '500':
          description: Erro interno; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
        '503':
          description: Serviço/armazenamento indisponível; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: professor
              password: ipb123
    get:
      operationId: getSession
      summary: Validar/restaurar sessão
      description: Valida a sessão antes de ativar rotas protegidas. O modo api não confia na sessão local demonstrativa.
      tags:
        - Autenticação
      x-authorized-role: [professor, coordenacao]
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                id: professor-01
                nome: Mariana Oliveira
                perfil: professor
        '401':
          description: Credenciais inválidas ou sessão ausente/expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHENTICATED
                message: Entre na sua conta para continuar.
        '500':
          description: Erro interno; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
        '503':
          description: Serviço/armazenamento indisponível; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
    delete:
      operationId: logout
      summary: Encerrar sessão
      description:
        Executado somente após confirmação de saída do formulário. Falha preserva a sessão atual (salvo
        401). Mock usa sessionStorage; falha no acesso é reportada.
      tags:
        - Autenticação
      x-authorized-role: [professor, coordenacao]
      responses:
        '204':
          description: Sucesso; corpo ausente.
        '401':
          description: Credenciais inválidas ou sessão ausente/expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHENTICATED
                message: Entre na sua conta para continuar.
        '403':
          description: A sessão não tem permissão para executar a operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: FORBIDDEN
                message: Você não tem permissão para esta operação.
        '422':
          description: Regra de validação do domínio não atendida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: DOMAIN_ERROR
                message: Informe um nome com até 100 caracteres.
        '500':
          description: Erro interno; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
        '503':
          description: Serviço/armazenamento indisponível; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
  /catalogo:
    get:
      operationId: getCatalog
      summary: Consultar o catálogo pedagógico
      description: Inclui cursos, módulos, lições, coordenação, professores e critérios de avaliação.
      tags:
        - Catálogo
      x-authorized-role: [professor, coordenacao]
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
              example:
                cursos:
                  - id: formacao
                    nome: Formação integral
                    modulos:
                      - id: identidade
                        nome: Módulo 1 · Identidade e valores
                        licoes:
                          - Quem sou eu
                          - Minhas habilidades
                          - Valores no dia a dia
                          - Escolhas e consequências
                professores:
                  - id: professor-01
                    nome: Mariana Oliveira
                    email: mariana@example.invalid
                coordenadores:
                  - id: coordenador-01
                    nome: Coordenação Pedagógica
                    cpf: '00000000000'
                    email: coordenacao@example.invalid
                criterios:
                  - id: conhecimento-conteudo
                    nome: Conhecimento do conteúdo
                  - id: criatividade
                    nome: Criatividade
        '401':
          description: Credenciais inválidas ou sessão ausente/expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHENTICATED
                message: Entre na sua conta para continuar.
        '500':
          description: Erro interno; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
        '503':
          description: Serviço/armazenamento indisponível; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
    post:
      operationId: registerCatalogItem
      summary: Cadastrar coordenação, professor, curso, módulo ou lição
      description: A coordenação autenticada é associada aos cursos e às lições que cadastra. Módulos são numerados no curso e lições no módulo.
      tags: [Catálogo]
      x-authorized-role: coordenacao
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRegistration'
            example: { tipo: curso, nome: Ciência da Computação, area: Tecnologia, cargaHorariaTotal: 3200 }
      responses:
        '201':
          description: Catálogo atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
              example:
                cursos:
                  - { id: curso-01, nome: Ciência da Computação, area: Tecnologia, cargaHorariaTotal: 3200, coordenadorId: coordenador-01, modulos: [] }
                professores: []
                criterios: []
                coordenadores:
                  - { id: coordenador-01, nome: Coordenação Pedagógica, cpf: '00000000000', email: coordenacao@example.invalid }
        '403':
          description: Ação reservada à coordenação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: { code: FORBIDDEN, message: Ação reservada à coordenação pedagógica. }
        '409':
          description: CPF, e-mail, número ou título em conflito com o catálogo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: { code: CONFLICT, message: Já existe um módulo com esse número no curso. }
        '422':
          description: Dados do cadastro inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: { code: DOMAIN_ERROR, message: Informe um número inteiro positivo. }
  /turmas/{turmaId}/professores:
    put:
      operationId: replaceTeachingAssignments
      summary: Atualizar professores vinculados à turma
      description: Substitui o conjunto de vínculos da turma. Deve permanecer pelo menos um professor.
      tags: [Turmas]
      x-authorized-role: coordenacao
      parameters:
        - name: turmaId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [professorIds]
              properties:
                professorIds: { type: array, minItems: 1, items: { type: string } }
            example: { professorIds: [professor-01, professor-02] }
      responses:
        '200':
          description: Turma com os vínculos atualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolClass'
              example:
                id: 6a
                nome: Turma A
                cursoId: formacao
                moduloId: identidade
                coordenadorId: coordenador-01
                faixaEtaria: Adultos
                modalidade: Presencial
                professorId: professor-01
                leciona:
                  - { professorId: professor-01, turmaId: 6a }
                  - { professorId: professor-02, turmaId: 6a }
                dias: [1, 3]
                inicio: '08:00'
                fim: '09:40'
                ativa: true
                alunoIds: [aluno-01]
                matriculas:
                  - { alunoId: aluno-01, turmaId: 6a, dataMatricula: '2026-11-18' }
        '403':
          description: Ação reservada à coordenação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: { code: FORBIDDEN, message: Ação reservada à coordenação pedagógica. }
  /pontos-mensais:
    get:
      operationId: listMonthlyTime
      summary: Consultar pontos mensais
      description: O professor consulta seus lançamentos. A coordenação consulta todos os lançamentos.
      tags: [Ponto mensal]
      x-authorized-role: [professor, coordenacao]
      responses:
        '200':
          description: Lista de lançamentos.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MonthlyTimeRecord'
                  total: { type: integer, minimum: 0 }
              example:
                items:
                  - { id: ponto-01, professorId: professor-01, mes: 11, ano: 2026, totalHorasAula: 12.5 }
                total: 1
    put:
      operationId: saveMonthlyTime
      summary: Registrar ou corrigir ponto mensal
      description: Atualiza o lançamento do professor autenticado para o mês e ano informados. O total é informado em horas decimais.
      tags: [Ponto mensal]
      x-authorized-role: professor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyTimeInput'
            example: { mes: 11, ano: 2026, totalHorasAula: 12.5 }
      responses:
        '200':
          description: Ponto salvo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyTimeRecord'
              example: { id: ponto-01, professorId: professor-01, mes: 11, ano: 2026, totalHorasAula: 12.5 }
        '403':
          description: Apenas o professor pode lançar o próprio ponto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: { code: FORBIDDEN, message: O ponto mensal deve ser lançado pelo professor. }
        '422':
          description: Mês, ano ou total inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example: { code: DOMAIN_ERROR, message: Total de horas-aula inválido. }
  /alunos:
    get:
      operationId: listStudents
      summary: Consultar alunos para matrículas e histórico
      description:
        Retorna todos os alunos, inclusive os que perderam matrícula. Nomes atuais alimentam listas de
        alunos; avaliações preservam seus nomes históricos.
      tags:
        - Alunos
      x-authorized-role: [professor, coordenacao]
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentList'
              example:
                items:
                  - id: aluno-01
                    nome: Ana Clara Santos
                total: 1
        '401':
          description: Credenciais inválidas ou sessão ausente/expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHENTICATED
                message: Entre na sua conta para continuar.
        '500':
          description: Erro interno; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
        '503':
          description: Serviço/armazenamento indisponível; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
  /turmas:
    get:
      operationId: listClasses
      summary: Consultar turmas ativas e arquivadas
      description:
        Snapshot completo. O professor atual pode consultar todas as turmas. Busca, filtros, ordenação e
        paginação da tela são locais.
      tags:
        - Turmas
      x-authorized-role: [professor, coordenacao]
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassList'
              example:
                items:
                  - id: turma-exemplo
                    nome: 8º ano A
                    cursoId: formacao
                    moduloId: identidade
                    professorId: professor-01
                    dias:
                      - 1
                      - 3
                    inicio: 08:00
                    fim: 08:50
                    ativa: true
                    alunoIds:
                      - aluno-01
                total: 1
        '401':
          description: Credenciais inválidas ou sessão ausente/expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHENTICATED
                message: Entre na sua conta para continuar.
        '500':
          description: Erro interno; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
        '503':
          description: Serviço/armazenamento indisponível; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
    post:
      operationId: createClass
      summary: Criar turma com matrículas
      description:
        Nome após trim obrigatório, até 60 caracteres, único sem distinguir maiúsculas em pt-BR.
        Curso/módulo e professor devem existir. Pelo menos um dia inteiro de 0 a 6. Início/fim no padrão de
        dois dígitos HH:mm, fim posterior ao início. Pelo menos um aluno existente. Dias e IDs de alunos são
        deduplicados. Não há validação de choque de horários, capacidade, faixa etária ou professor
        proprietário. ativa=false arquiva e preserva histórico. O ID é gerado no servidor.
      tags:
        - Turmas
      x-authorized-role: [professor, coordenacao]
      responses:
        '201':
          description: Sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolClass'
              example:
                id: turma-exemplo
                nome: 8º ano A
                cursoId: formacao
                moduloId: identidade
                professorId: professor-01
                dias:
                  - 1
                  - 3
                inicio: 08:00
                fim: 08:50
                ativa: true
                alunoIds:
                  - aluno-01
        '400':
          description: Estrutura JSON inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_REQUEST
                message: Formato da requisição inválido.
        '401':
          description: Credenciais inválidas ou sessão ausente/expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHENTICATED
                message: Entre na sua conta para continuar.
        '403':
          description: A sessão não tem permissão para executar a operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: FORBIDDEN
                message: Você não tem permissão para esta operação.
        '404':
          description: Recurso ou matrícula inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: DOMAIN_ERROR
                message: Turma não encontrada.
        '409':
          description: Conflito de unicidade ou turma arquivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: CONFLICT
                message: Já existe uma turma com esse nome.
        '422':
          description: Regra de validação do domínio não atendida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: DOMAIN_ERROR
                message: Informe um nome com até 100 caracteres.
        '500':
          description: Erro interno; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
        '503':
          description: Serviço/armazenamento indisponível; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassRequest'
            example:
              nome: 8º ano A
              cursoId: formacao
              moduloId: identidade
              professorId: professor-01
              dias:
                - 1
                - 3
              inicio: 08:00
              fim: 08:50
              ativa: true
              alunoIds:
                - aluno-01
    delete:
      operationId: deleteClasses
      summary: Excluir turmas e registros associados em lote
      description:
        'Lista não vazia; todas as turmas devem existir. Operação atômica: remove turmas, fixações,
        aulas, frequências e avaliações vinculadas/legadas das turmas. Preserva catálogo global de alunos. O
        corpo DELETE deve ser suportado pelo backend e proxies.'
      tags:
        - Turmas
      x-authorized-role: [professor, coordenacao]
      responses:
        '204':
          description: Sucesso; corpo ausente.
        '400':
          description: Estrutura JSON inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_REQUEST
                message: Formato da requisição inválido.
        '401':
          description: Credenciais inválidas ou sessão ausente/expirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHENTICATED
                message: Entre na sua conta para continuar.
        '403':
          description: A sessão não tem permissão para executar a operação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: FORBIDDEN
                message: Você não tem permissão para esta operação.
        '404':
          description: Recurso ou matrícula inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: DOMAIN_ERROR
                message: Turma não encontrada.
        '409':
          description: Conflito de unicidade ou turma arquivada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: CONFLICT
                message: Já existe uma turma com esse nome.
        '422':
          description: Regra de validação do domínio não atendida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: DOMAIN_ERROR
                message: Informe um nome com até 100 caracteres.
        '500':
          description: Erro interno; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
        '503':
          description: Serviço/armazenamento indisponível; simulável por configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: MOCK_FAILURE
                message: Falha simulada na API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteClassesRequest'
            example:
              ids:
                - turma-exemplo
  /turmas/{turmaId}:
    put:
      operationId: updateClass
      summary: Substituir dados da turma, arquivar ou reativar
      description:
        Nome após trim obrigatório, até 60 caracteres, único sem distinguir maiúsculas em pt-BR.
        Curso/módulo e professor devem existir. Pelo menos um dia inteiro de 0 a 6. Início/fim no padrão de
        dois dígitos HH:mm, fim posterior ao início. Pelo menos um aluno existente. Dias e IDs de alunos são
        deduplicados. Não há validação de choque de horários, capacidade, faixa etária ou professor
        proprietário. ativa=false arquiva e preserva histórico. Turma deve existir. Permite gestão de turma
        arquivada. Não remove marcas históricas de matrículas retiradas.
      tags:
        - Turmas
      x-authorized-role: [professor, coordenacao]
      responses:
        '200':
          description: Sucesso.
