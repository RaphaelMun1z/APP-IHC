components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ipb_session
      description:
        'Proposta pendente: cookie de sessão HttpOnly, Secure em HTTPS, SameSite conforme origens. O mock
        usa somente sessionStorage e não emite cookie real.'
  schemas:
    Person:
      type: object
      properties:
        id:
          type: string
          description: Identificador opaco; não pressupor UUID.
        nome:
          type: string
          description: Nome de exibição.
      required:
        - id
        - nome
    Student:
      type: object
      properties:
        id:
          type: string
          description: ID opaco.
        nome:
          type: string
          description: Nome após trim.
          minLength: 1
          maxLength: 100
        cpf: { type: string, maxLength: 150 }
        dataNascimento: { type: string, description: Data no formato AAAA-MM-DD ou vazia. }
        email: { type: string, maxLength: 150 }
        telefone: { type: string, maxLength: 150 }
        logradouro: { type: string, maxLength: 150 }
        numero: { type: string, maxLength: 150 }
        bairro: { type: string, maxLength: 150 }
        cidade: { type: string, maxLength: 150 }
        uf: { type: string, maxLength: 2 }
        cep: { type: string, maxLength: 150 }
        nomeMae: { type: string, maxLength: 150 }
        nomePai: { type: string, maxLength: 150 }
        coordenadorId: { type: string }
      required:
        - id
        - nome
    Session:
      type: object
      properties:
        id:
          type: string
          description: ID do usuário.
        nome:
          type: string
          description: Nome do usuário.
        perfil:
          type: string
          enum: [professor, coordenacao]
      required:
        - id
        - nome
        - perfil
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          description: 'No mock: professor ou coordenacao, sem distinção entre maiúsculas e minúsculas.'
        password:
          type: string
          description: 'No mock: credencial pública ipb123.'
      required:
        - username
        - password
    StudentRequest:
      type: object
      properties:
        nome:
          type: string
          description: Nome após trim deve ter entre 1 e 100 caracteres.
        cpf: { type: string, maxLength: 150 }
        dataNascimento: { type: string, description: Data no formato AAAA-MM-DD ou vazia. }
        email: { type: string, maxLength: 150 }
        telefone: { type: string, maxLength: 150 }
        logradouro: { type: string, maxLength: 150 }
        numero: { type: string, maxLength: 150 }
        bairro: { type: string, maxLength: 150 }
        cidade: { type: string, maxLength: 150 }
        uf: { type: string, maxLength: 2 }
        cep: { type: string, maxLength: 150 }
        nomeMae: { type: string, maxLength: 150 }
        nomePai: { type: string, maxLength: 150 }
      required:
        - nome
    CourseModule:
      type: object
      properties:
        id:
          type: string
          description: ID do módulo no curso.
        nome:
          type: string
          description: Nome do módulo.
        cursoId: { type: string }
        numero: { type: integer, minimum: 1 }
        curriculo:
          type: array
          items:
            $ref: '#/components/schemas/CurriculumLesson'
        licoes:
          type: array
          items:
            type: string
            description: Conteúdo selecionável pelo texto.
      required:
        - id
        - nome
        - licoes
    Course:
      type: object
      properties:
        id:
          type: string
          description: ID do curso.
        nome:
          type: string
          description: Nome do curso.
        coordenadorId: { type: string }
        area: { type: string }
        cargaHorariaTotal: { type: integer, minimum: 1 }
        modulos:
          type: array
          items:
            $ref: '#/components/schemas/CourseModule'
      required:
        - id
        - nome
        - modulos
    Catalog:
      type: object
      properties:
        cursos:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        professores:
          type: array
          items:
            $ref: '#/components/schemas/Teacher'
        coordenadores:
          type: array
          items:
            $ref: '#/components/schemas/Coordinator'
        criterios:
          type: array
          items:
            $ref: '#/components/schemas/Person'
      required:
        - cursos
        - professores
        - criterios
    ClassRequest:
      type: object
      properties:
        nome:
          type: string
          description: Nome após trim, de 1 a 60 caracteres. Único sem distinguir maiúsculas no locale pt-BR.
        cursoId:
          type: string
          description: Curso existente no catálogo.
        faixaEtaria: { type: string, maxLength: 100 }
        modalidade: { type: string, maxLength: 100 }
        moduloId:
          type: string
          description: Módulo pertencente ao curso.
        professorId:
          type: string
          description: Professor do primeiro vínculo. Ao criar com perfil de professor, a API usa o professor autenticado.
        dias:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          minItems: 1
          description: 0 domingo a 6 sábado; duplicatas são removidas.
        inicio:
          type: string
          description: Horário inicial.
          pattern: ^\d{2}:\d{2}$
        fim:
          type: string
          description: Horário final, posterior ao inicial pela comparação HH:mm.
          pattern: ^\d{2}:\d{2}$
        ativa:
          type: boolean
          description: Arquivada permite consulta, gestão e exclusão, mas bloqueia gravações pedagógicas e matrículas.
        alunoIds:
          type: array
          items:
            type: string
            description: ID de aluno existente.
          minItems: 1
          description: Ao menos um aluno. Duplicatas são removidas. Um aluno pode ter matrícula em até 10 turmas.
      required:
        - nome
        - cursoId
        - moduloId
        - professorId
        - dias
        - inicio
        - fim
        - ativa
        - alunoIds
    SchoolClass:
      type: object
      properties:
        id:
          type: string
          description: ID gerado pelo servidor; IDs demonstrativos são preservados.
        nome:
          type: string
          description: Nome após trim, de 1 a 60 caracteres. Único sem distinguir maiúsculas no locale pt-BR.
        cursoId:
          type: string
          description: Curso existente no catálogo.
        moduloId:
          type: string
          description: Módulo pertencente ao curso.
        professorId:
          type: string
          description: Professor principal para compatibilidade. Consulte leciona para todos os vínculos.
        coordenadorId: { type: string }
        faixaEtaria: { type: string }
        modalidade: { type: string }
        matriculas:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentLink'
        leciona:
          type: array
          items:
            $ref: '#/components/schemas/TeachingAssignment'
        dias:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          minItems: 1
          description: 0 domingo a 6 sábado; duplicatas são removidas.
        inicio:
          type: string
          description: Horário inicial.
          pattern: ^\d{2}:\d{2}$
        fim:
          type: string
          description: Horário final, posterior ao inicial pela comparação HH:mm.
          pattern: ^\d{2}:\d{2}$
        ativa:
          type: boolean
          description: Arquivada permite consulta, gestão e exclusão, mas bloqueia gravações pedagógicas e matrículas.
        alunoIds:
          type: array
          items:
            type: string
            description: ID de aluno existente.
          minItems: 1
          description: Ao menos um aluno. Duplicatas são removidas.
      required:
        - id
        - nome
        - cursoId
        - moduloId
        - professorId
        - dias
        - inicio
        - fim
        - ativa
        - alunoIds
    Teacher:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          properties:
            cpf: { type: string }
            email: { type: string, format: email }
            telefone: { type: string }
    Coordinator:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          required: [cpf, email]
          properties:
            cpf: { type: string }
            email: { type: string, format: email }
    CurriculumLesson:
      type: object
      required: [id, moduloId, coordenadorId, numero, titulo]
      properties:
        id: { type: string }
        moduloId: { type: string }
        coordenadorId: { type: string }
        numero: { type: integer, minimum: 1 }
        titulo: { type: string, minLength: 1, maxLength: 150 }
    EnrollmentLink:
      type: object
      required: [alunoId, turmaId, dataMatricula]
      properties:
        alunoId: { type: string }
        turmaId: { type: string }
        dataMatricula:
          type: [string, 'null']
          format: date
          description: Data local da matrícula. Nula para registros antigos sem data conhecida.
    TeachingAssignment:
      type: object
      required: [professorId, turmaId]
      properties:
        professorId: { type: string }
        turmaId: { type: string }
    MonthlyTimeInput:
      type: object
      required: [mes, ano, totalHorasAula]
      properties:
        mes: { type: integer, minimum: 1, maximum: 12 }
        ano: { type: integer, minimum: 1900, maximum: 9999 }
        totalHorasAula: { type: number, minimum: 0, maximum: 744, description: Até duas casas decimais. }
    MonthlyTimeRecord:
      allOf:
        - $ref: '#/components/schemas/MonthlyTimeInput'
        - type: object
          required: [id, professorId]
          properties:
            id: { type: string }
            professorId: { type: string }
    CatalogRegistration:
      type: object
      required: [tipo]
      properties:
        tipo: { enum: [coordenador, professor, curso, modulo, licao] }
        nome: { type: string, minLength: 1, maxLength: 150 }
        cpf: { type: string }
        email: { type: string, format: email }
        telefone: { type: string }
        area: { type: string, minLength: 1, maxLength: 150 }
        cargaHorariaTotal: { type: integer, minimum: 1 }
        cursoId: { type: string }
        moduloId: { type: string }
        numero: { type: integer, minimum: 1 }
        titulo: { type: string, minLength: 1, maxLength: 150 }
      allOf:
        - if: { properties: { tipo: { enum: [professor, coordenador] } } }
          then: { required: [nome, cpf, email] }
        - if: { properties: { tipo: { const: professor } } }
          then: { required: [telefone] }
        - if: { properties: { tipo: { const: curso } } }
          then: { required: [nome, area, cargaHorariaTotal] }
        - if: { properties: { tipo: { const: modulo } } }
          then: { required: [cursoId, nome, numero] }
        - if: { properties: { tipo: { const: licao } } }
          then: { required: [cursoId, moduloId, numero, titulo] }
    ClassList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SchoolClass'
        total:
          type: integer
          minimum: 0
      required:
        - items
        - total
    StudentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Student'
        total:
          type: integer
          minimum: 0
      required:
        - items
        - total
    DeleteClassesRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            description: ID de turma existente.
          minItems: 1
      required:
        - ids
    Pins:
      type: object
      properties:
        turmaIds:
          type: array
          items:
            type: string
            description: ID de turma fixada.
          uniqueItems: true
          description: Ordem em que foram fixadas.
      required:
