<main class="app-page turmas-page">
  <app-filter-panel
    [searchable]="true"
    [refinable]="false"
    [chips]="chips()"
    [activeCount]="chips().length"
    (removeFilter)="setQuery('')"
    (clearFilters)="setQuery('')"
  >
    <label filter-search class="filter-search-label"
      ><span class="sr-only">Buscar turma pelo nome</span
      ><input
        type="search"
        placeholder="Buscar turma"
        [ngModel]="query()"
        (ngModelChange)="setQuery($event)"
    /></label>
    <a filter-actions appAction="add" class="app-button primary" routerLink="/turma-form"
      >Nova turma</a
    >
  </app-filter-panel>
  <section class="surface data-panel" aria-label="Listagem de turmas">
    <app-list-header
      title="Turmas disponíveis"
      [count]="filtered().length"
      singular="turma"
      plural="turmas"
    />
    <app-feedback [message]="message()" [error]="isError()" />
    <app-data-table class="turmas-table-scroll" label="Turmas disponíveis">
      <table class="turmas-table">
        <caption class="sr-only">
          Turmas, cursos e ações disponíveis
        </caption>
        <thead>
          <tr>
            <th scope="col">Turma</th>
            <th scope="col">Curso</th>
            <th scope="col" class="actions-cell">Ações</th>
          </tr>
        </thead>
        <tbody>
          @for (group of visible(); track group.id) {
            <tr class="turma-row">
              <th scope="row">
                <a
                  class="turma-name-link"
                  [routerLink]="['/turmas', group.id]"
                  [queryParams]="{ retorno: currentUrl() }"
                  >{{ group.nome }}</a
                >
              </th>
              <td>{{ store.course(group.cursoId)?.nome }}</td>
              <td class="actions-cell">
                <div class="row-actions">
                  <a
                    appAction="open_in_new"
                    class="icon-button"
                    title="Abrir"
                    [attr.aria-label]="'Abrir ' + group.nome"
                    [routerLink]="['/turmas', group.id]"
                    [queryParams]="{ retorno: currentUrl() }"
                  ></a>
                  <a
                    appAction="edit"
                    class="icon-button"
                    title="Editar"
                    [attr.aria-label]="'Editar ' + group.nome"
                    routerLink="/turma-form"
                    [queryParams]="{ turma: group.id, retorno: currentUrl() }"
                  ></a>
                  <button
                    appAction="delete"
                    class="icon-button danger"
                    type="button"
                    title="Excluir"
                    [attr.aria-label]="'Excluir ' + group.nome"
                    (click)="remove(group.id)"
                  ></button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="app-empty">Nenhuma turma encontrada.</td>
            </tr>
          }
        </tbody>
      </table>
    </app-data-table>
    <app-pagination
      [total]="filtered().length"
      [page]="paging.current()"
      [size]="paging.size()"
      (pageChange)="paging.page.set($event)"
      (sizeChange)="paging.resize($event)"
    />
  </section>
</main>
