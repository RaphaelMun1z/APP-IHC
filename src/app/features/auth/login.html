<main class="app-login">
  <section class="app-login-story" aria-label="IPB">
    <img src="./assets/login-photo.png" alt="" class="app-login-photo" fetchpriority="high" />
    <div class="app-login-wordmark">
      <img src="./assets/ipb_logo.png" alt="IPB" class="app-login-logo" />
      <span>IPB</span>
    </div>
  </section>
  <section class="app-login-form" aria-labelledby="login-title">
    <div class="app-login-content">
      <header class="app-login-heading">
        <h1 id="login-title">Bem-vindo ao IPB</h1>
        <p>
          {{
            demoAccess
              ? 'Demonstração local. Os registros ficam neste navegador.'
              : 'Entre com sua conta.'
          }}
        </p>
      </header>
      <form id="login-form" [formGroup]="form" (ngSubmit)="submit()" (input)="message.set('')">
        <div class="app-login-field">
          <label for="usuario">Usuário</label>
          <input
            id="usuario"
            formControlName="username"
            name="usuario"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            placeholder="Seu usuário"
            required
          />
        </div>
        <div class="app-login-field app-login-password">
          <label for="senha">Senha</label>
          <input
            id="senha"
            formControlName="password"
            name="senha"
            type="password"
            autocomplete="current-password"
            placeholder="Sua senha"
            required
          />
        </div>
        <button
          id="forgot-password"
          (click)="showHelp('forgot')"
          type="button"
          class="app-login-link app-login-forgot"
        >
          Esqueceu a senha?
        </button>
        <label class="app-login-remember" for="remember-login">
          <span>Lembrar meu usuário</span>
          <input
            id="remember-login"
            formControlName="remember"
            (change)="rememberChanged()"
            name="remember"
            type="checkbox"
            role="switch"
            checked
          />
          <span class="app-login-switch" aria-hidden="true"></span>
        </label>
        <app-feedback [message]="message()" [error]="true" />
        <button type="submit" class="app-login-submit">Entrar</button>
      </form>
      <div class="app-login-divider"><span>OU</span></div>
      <button id="google-login" (click)="showHelp('google')" type="button" class="app-login-google">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.52h3.24c1.9-1.75 2.98-4.33 2.98-7.37Z"
          />
          <path
            fill="#34A853"
            d="M12 22c2.7 0 4.96-.9 6.62-2.4l-3.24-2.52c-.9.6-2.04.96-3.38.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.6A10 10 0 0 0 12 22Z"
          />
          <path
            fill="#FBBC05"
            d="M6.39 13.91A6 6 0 0 1 6.08 12c0-.66.11-1.3.31-1.91v-2.6H3.04A10 10 0 0 0 2 12c0 1.61.39 3.14 1.04 4.51l3.35-2.6Z"
          />
          <path
            fill="#EA4335"
            d="M12 5.96c1.47 0 2.79.5 3.82 1.49l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.96 5.49l3.35 2.6C7.18 7.72 9.39 5.96 12 5.96Z"
          />
        </svg>
        <span>Google · indisponível nesta demonstração</span>
      </button>
      <p class="app-login-signup">
        Não tem uma conta?
        <button id="signup-login" (click)="showHelp('signup')" type="button" class="app-login-link">
          Sobre cadastro · indisponível
        </button>
      </p>
      @if (demoAccess) {
        <button id="preencher-demo" (click)="fillDemo()" type="button" class="app-login-dev">
          <span class="app-login-dev-badge">DEV</span><span>Preencher credenciais de teste</span>
        </button>
        <button (click)="fillDemo(true)" type="button" class="app-login-dev">
          <span class="app-login-dev-badge">DEV</span><span>Preencher acesso da coordenação</span>
        </button>
      }
    </div>
  </section>
</main>
<app-modal
  [title]="help()?.title ?? ''"
  [open]="help() !== null"
  [compact]="true"
  (closed)="help.set(null)"
  ><p>{{ help()?.description }}</p>
  <button type="button" class="app-login-submit" (click)="help.set(null)">
    Voltar ao login
  </button></app-modal
>
